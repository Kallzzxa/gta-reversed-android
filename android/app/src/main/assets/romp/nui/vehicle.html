<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RO-MP Vehicle</title>
<style>
  /* Daftar kendaraan ala SA-MP versi UI.
     Ini jembatan NUI: client game sesungguhnya merender kendaraan 3D di
     dunia dari paket 0x13/0x14/0x15/0x16, halaman ini hanya indikator
     2D fallback (daftar + health bar). */
  * { box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden;
      background: transparent; }
  #v-panel { position: absolute; right: 8px; bottom: 8px; width: 190px;
      max-height: 45%; overflow: hidden; pointer-events: none;
      font-family: Arial, sans-serif; font-size: 11px; color: #fff;
      background: rgba(0, 0, 0, .45); border: 1px solid rgba(240, 180, 41, .6);
      border-radius: 6px; padding: 6px 8px; display: none; }
  #v-panel h4 { font-size: 11px; color: #F0B429; margin-bottom: 4px;
      letter-spacing: 1px; }
  .vrow { margin-bottom: 5px; text-shadow: 1px 1px 0 #000; }
  .vrow .nm { font-weight: bold; }
  .vrow .hp { height: 5px; background: #400; border-radius: 3px; margin-top: 2px;
      overflow: hidden; }
  .vrow .hp > div { height: 100%; background: linear-gradient(90deg, #e33, #fc3, #3d5);
      border-radius: 3px; }
  .vrow.wreck .nm { color: #f66; text-decoration: line-through; }
  .vrow .sub { color: #ccc; font-size: 10px; }
</style>
</head>
<body>
<div id="v-panel"><h4>KENDARAAN</h4><div id="v-list"></div></div>
<script>
// Server -> UI: vehicle.lua (via 0x40) mengirim showVehicle / updateVehicle /
// hideVehicle tiap ada perubahan (di-diff tiap 1 detik).
window.onRomMessage = function (json) {
  var msg;
  try { msg = JSON.parse(json); } catch (e) { return; }
  if (msg.action === "showVehicle") render(msg, true);
  else if (msg.action === "updateVehicle") render(msg, false);
  else if (msg.action === "hideVehicle") remove(msg.id);
};

var panel = document.getElementById("v-panel");
var list = document.getElementById("v-list");

function el(id) { return document.getElementById("v-" + id); }

function remove(id) {
  var d = el(id);
  if (d) d.parentNode.removeChild(d);
  if (!list.firstChild) panel.style.display = "none";
}

  434: "Hotknife", 436: "Previon", 438: "Cabbie", 439: "Stallion",
  440: "Rumpo", 442: "Romero", 443: "Packer", 445: "Admiral",
  451: "Turismo", 452: "Speeder", 453: "Reefer", 454: "Tropic",
  461: "PCJ-600", 462: "Faggio", 463: "Freeway", 468: "Sanchez",
  471: "Quad", 472: "Coastguard", 473: "Dinghy", 476: "Rustler",
  480: "Comet", 481: "BMX", 482: "Burrito", 483: "Camper",
  485: "Baggage", 486: "Dozer", 487: "Maverick", 488: "News Chopper",
  489: "Rancher", 490: "FBI Rancher", 491: "Virgo", 492: "Greenwood",
  494: "Hotring", 495: "Sandking", 496: "Blista Compact", 497: "Police Maverick",
  498: "Boxville", 499: "Benson", 500: "Mesa", 502: "Hotring Racer",
  503: "Hotring Racer", 504: "Bloodring Banger", 505: "Rancher",
  506: "Super GT", 507: "Elegant", 508: "Journey", 509: "Bike",
  510: "Mountain Bike", 511: "Beagle", 512: "Cropduster", 513: "Stunt",
  514: "Tanker", 515: "Roadtrain", 516: "Nebula", 517: "Majestic",
  518: "Buccaneer", 520: "Hydra", 521: "FCR-900", 522: "NRG-500",
  523: "HPV1000", 524: "Cement Truck", 525: "Tow Truck", 526: "Fortune",
  527: "Cadrona", 528: "FBI Truck", 529: "Willard", 530: "Forklift",
  531: "Tractor", 532: "Combine", 533: "Feltzer", 534: "Remington",
  535: "Slamvan", 536: "Blade", 540: "Vincent", 541: "Bullet",

  576: "Tornado", 577: "AT-400", 578: "DFT-30", 579: "Huntley",

  584: "Petrol Trailer", 585: "Emperor", 586: "Wayfarer", 587: "Euros",

  604: "Glendale", 605: "Sadler", 606: "Bagbox A", 607: "Bagbox B",
  608: "Tug Stairs", 609: "Boxburg", 610: "Farm Trailer", 611: "Utility Trailer"
};

function nameFor(model) {
  return NAMES[Number(model)] || ("KENDARAAN " + model);
}

function render(m, full) {
  var d = el(m.id);
  if (!d) {
    d = document.createElement("div");
    d.id = "v-" + m.id;
    d.className = "vrow";
    d.innerHTML = '<div class="nm"></div><div class="hp"><div></div></div>' +
                  '<div class="sub"></div>';
    list.appendChild(d);
  }
  if (full) d.querySelector(".nm").textContent =
      "#" + m.vid + " " + nameFor(m.model);
  var hp = Math.max(0, Math.min(1000, Number(m.health))) / 10;
  d.querySelector(".hp > div").style.width = hp + "%";
  var wreck = !!m.destroyed;
  d.className = "vrow" + (wreck ? " wreck" : "");
  var drv = (m.driver === null || m.driver === undefined || m.driver < 0)
      ? "-" : ("sopir #" + m.driver);
  d.querySelector(".sub").textContent =
      wreck ? "HANCUR" : ("HP " + Math.round(hp) + "% | " + drv);
  panel.style.display = "block";
}
</script>
</body>
</html>
