<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RO-MP Server Browser</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden;
      background: #0b0d11; color: #eee; font-family: system-ui, sans-serif; }
  #head { padding: 12px 16px 8px; border-bottom: 1px solid rgba(0,200,180,.25); }
  #head h1 { font-size: 17px; letter-spacing: 2px; color: #4de3c8;
      text-transform: uppercase; margin-bottom: 8px; }
  #tabs { display: flex; gap: 6px; }
  .tab { flex: 1; text-align: center; padding: 8px; font-size: 13px;
      background: rgba(255,255,255,.05); color: #aaa; border-radius: 8px;
      border: 1px solid transparent; cursor: pointer; }
  .tab.on { color: #4de3c8; border-color: rgba(0,200,180,.5);
      background: rgba(0,200,180,.08); }
  #list { overflow-y: auto; height: calc(100% - 190px); padding: 10px 12px; }
  .srv { background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px; padding: 12px; margin-bottom: 8px; cursor: pointer;
      position: relative; }
  .srv:active { border-color: #4de3c8; transform: scale(.99); }
  .srv .hn { font-size: 15px; font-weight: 600; padding-right: 30px; }
  .srv .mt { font-size: 12px; color: #999; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srv .meta { display: flex; justify-content: space-between; margin-top: 8px;
      font-size: 12px; color: #4de3c8; }
  .srv .lock { color: #e3a44d; }
  .fav { position: absolute; top: 10px; right: 10px; font-size: 18px;
      padding: 4px; }
  #empty { text-align: center; color: #666; margin-top: 40px; font-size: 14px;
      line-height: 1.8; }
  #manual { display: flex; gap: 8px; padding: 10px 12px;
      border-top: 1px solid rgba(255,255,255,.08); }
  #manual input { flex: 1; background: rgba(255,255,255,.06); border: 1px solid
      rgba(255,255,255,.15); border-radius: 8px; color: #eee; padding: 10px;
      font-size: 14px; }
  #manual button, #ref { background: rgba(0,200,180,.15); border: 1px solid
      rgba(0,200,180,.5); color: #4de3c8; border-radius: 8px; padding: 10px 14px;
      font-size: 14px; }
  #refrow { display: flex; padding: 0 12px; }
  #ref { flex: 1; }
  /* Dialog password ala SA-MP DIALOG_STYLE_PASSWORD */
  #pw-overlay { position: fixed; left: 0; top: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,.65); display: none; align-items: center;
      justify-content: center; z-index: 50; }
  #pw-overlay.show { display: flex; }
  #pw-box { width: 86%; max-width: 340px; background: #14181e;
      border: 1px solid rgba(227,164,77,.6); border-radius: 12px; padding: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.6); }
  #pw-box h2 { font-size: 15px; color: #e3a44d; margin-bottom: 8px; }
  #pw-box p { font-size: 12px; color: #999; margin-bottom: 10px;
      line-height: 1.6; }
  #pw-box input { width: 100%; background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.2); border-radius: 8px; color: #eee;
      padding: 11px; font-size: 15px; margin-bottom: 14px; }
  #pw-row { display: flex; gap: 8px; }
  #pw-row button { flex: 1; border-radius: 8px; padding: 11px; font-size: 14px;
      cursor: pointer; }
  #pw-ok { background: rgba(0,200,180,.18); border: 1px solid
      rgba(0,200,180,.55); color: #4de3c8; }
  #pw-cancel { background: rgba(255,255,255,.05); border: 1px solid
      rgba(255,255,255,.18); color: #aaa; }
</style>
</head>
<body>
<div id="head">
  <h1>Server Browser</h1>
  <div id="tabs">
    <div class="tab on" id="t-lan">📡 LAN</div>
    <div class="tab" id="t-net">🌐 Internet</div>
    <div class="tab" id="t-fav">⭐ Favorit</div>
  </div>
</div>
<div id="refrow"><button id="ref">⟳ Refresh</button></div>
<div id="list"><div id="empty">Memuat…</div></div>
<div id="manual">
  <input id="ipport" placeholder="IP:port mis. 192.168.1.5:7777" />
  <button id="go">Connect</button>
</div>
<!-- Prompt password sebelum connect (ala SA-MP DIALOG_STYLE_PASSWORD) -->
<div id="pw-overlay">
  <div id="pw-box">
    <h2>🔒 Server Terkunci</h2>
    <p id="pw-text">Server ini membutuhkan password:</p>
    <input id="pw-input" type="password" placeholder="Password server"
        autocomplete="off" maxlength="64" />
    <div id="pw-row">
      <button id="pw-cancel">Batal</button>
      <button id="pw-ok">Hubungkan</button>
    </div>
  </div>
</div>
<script>
var mode = "lan";
// Favorit: pakai native ROMPFavorites (mirip SA-MP Mobile Launcher),
// fallback ke localStorage kalau bridge tidak ada.
var favs = [];
var useNativeFav = !!(window.romp && window.romp.loadFavorites);
try { favs = JSON.parse(localStorage.getItem("romp_favs") || "[]"); } catch (e) {}

function saveFavs() {
  try { localStorage.setItem("romp_favs", JSON.stringify(favs)); } catch (e) {}
}
function isFav(ip, port) {
  if (useNativeFav && window.romp.isFavorite) {
    try { return window.romp.isFavorite(ip, port); } catch (e) {}
  }
  return favs.some(function (f) { return f.ip === ip && f.port === port; });
}
function toggleFav(ip, port, hostname) {
  if (useNativeFav && window.romp.toggleFavorite) {
    window.romp.toggleFavorite(ip, port, hostname || "");
    return;  // onFavorites() akan dipanggil balik
  }
  var i = favs.findIndex(function (f) { return f.ip === ip && f.port === port; });
  if (i >= 0) favs.splice(i, 1);
  else favs.push({ ip: ip, port: port, hostname: hostname || (ip + ":" + port) });
  saveFavs();
  render(current);
}

// Dipanggil native setelah daftar favorit berubah.
var current = [];
window.onFavorites = function (json) {
  try { favs = JSON.parse(json); } catch (e) { favs = []; }
  saveFavs();  // sinkronkan cache lokal
  if (mode === "fav") render(favs);
  else render(current);
};

// Dipanggil native setelah daftar selesai.
window.onServers = function (json) {
  try { current = JSON.parse(json); } catch (e) { current = []; }
  render(current);
};

function render(arr) {
  var list = document.getElementById("list");
  list.innerHTML = "";
  if (mode === "fav") arr = favs;
  if (!arr.length) {
    var hint = mode === "lan"
      ? "Tidak ada server di WiFi ini.<br>Pastikan server nyala &<br>satu jaringan dengan HP."
      : mode === "net"
      ? "Tidak ada server internet.<br>Butuh master server / VPS."
      : "Belum ada favorit.<br>Ketuk ⭐ di server untuk menyimpan.";
    list.innerHTML = '<div id="empty">' + hint + "</div>";
    return;
  }
  arr.forEach(function (s) {
    var d = document.createElement("div");
    d.className = "srv";
    var lock = s.has_password ? ' <span class="lock">🔒</span>' : "";
    var star = isFav(s.ip, s.port) ? "⭐" : "☆";
    d.innerHTML = '<div class="hn">' + esc(s.hostname) + lock + "</div>" +
      '<div class="fav">' + star + "</div>" +
      '<div class="mt">' + esc(s.motd || "") + "</div>" +
      '<div class="meta"><span>👥 ' + s.players + "/" + s.maxplayers +
      "</span><span>" + esc(s.ip) + ":" + s.port +
      "</span><span>📶 " + s.ping_ms + " ms</span></div>";
    d.querySelector(".fav").onclick = function (ev) {
      ev.stopPropagation();
      toggleFav(s.ip, s.port, s.hostname);
    };
    d.onclick = function () { connectTo(s.ip, s.port, !!s.has_password); };
    list.appendChild(d);
  });
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function connectTo(ip, port, hasPassword) {
  // Ala SA-MP: server ber-password minta password dulu sebelum connect.
  if (hasPassword) showPasswordPrompt(ip, port);
  else doConnect(ip, port, "");
}
function doConnect(ip, port, password) {
  if (window.romp && window.romp.connect) window.romp.connect(ip, port, password || "");
}

/* --- Dialog password ala SA-MP DIALOG_STYLE_PASSWORD --- */
var pwIp = "", pwPort = 0;
function showPasswordPrompt(ip, port) {
  pwIp = ip; pwPort = port;
  document.getElementById("pw-text").textContent =
      "Server " + ip + ":" + port + " membutuhkan password:";
  document.getElementById("pw-input").value = "";
  document.getElementById("pw-overlay").classList.add("show");
  setTimeout(function () {
    document.getElementById("pw-input").focus();
  }, 100);
}
function hidePasswordPrompt() {
  document.getElementById("pw-overlay").classList.remove("show");
}
document.getElementById("pw-ok").onclick = function () {
  var pw = document.getElementById("pw-input").value;
  hidePasswordPrompt();
  doConnect(pwIp, pwPort, pw);
};
document.getElementById("pw-cancel").onclick = hidePasswordPrompt;
document.getElementById("pw-input").onkeydown = function (ev) {
  if (ev.key === "Enter") document.getElementById("pw-ok").click();
};
function setMode(m) {
  mode = m;
  ["lan", "net", "fav"].forEach(function (x) {
    document.getElementById("t-" + x).classList.toggle("on", x === m);
  });
  doRefresh();
}
function doRefresh() {
  var list = document.getElementById("list");
  list.innerHTML = '<div id="empty">Memuat…</div>';
  if (!window.romp) { render([]); return; }
  if (mode === "lan" && window.romp.scanLan) window.romp.scanLan();
  else if (mode === "net" && window.romp.refresh) window.romp.refresh();
  else if (mode === "fav") {
    if (window.romp.loadFavorites) window.romp.loadFavorites();
    else render(favs);
  }
}

document.getElementById("t-lan").onclick = function () { setMode("lan"); };
document.getElementById("t-net").onclick = function () { setMode("net"); };
document.getElementById("t-fav").onclick = function () { setMode("fav"); };
document.getElementById("ref").onclick = doRefresh;
document.getElementById("go").onclick = function () {
  var v = document.getElementById("ipport").value.trim();
  var m = v.match(/^([^:]+):(\d+)$/);
  // Manual: tidak tahu has_password — selalu tawarkan input password
  // (kosongkan jika server tanpa password, seperti dialog SA-MP).
  if (m) showPasswordPrompt(m[1], parseInt(m[2], 10));
};

// Default: scan LAN (tanpa VPS).
doRefresh();
</script>
</body>
</html>
