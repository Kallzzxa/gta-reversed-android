# RO-MP Dedicated Server — konfigurasi
# Format: <key> <value>   (baris diawali # = komentar)

# Nama server yang tampil di client
hostname RO-MP Gabut Server

# Pesan selamat datang
motd Selamat datang di RO-MP! Ketik /help untuk command.

# Port TCP server
port 7777

# Maksimal pemain (1-120)
maxplayers 50

# Password server (kosongkan = tanpa password)
password
