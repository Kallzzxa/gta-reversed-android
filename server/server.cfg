# RO-MP Dedicated Server — konfigurasi
# Format: <key> <value>   (baris diawali # = komentar)

# Nama server yang tampil di client
hostname RO-MP Gabut Server

# Pesan selamat datang
motd Selamat datang di RO-MP! Ketik /help untuk command.

# Port TCP server
port 7777

# Maksimal pemain (1-120)
maxplayers 50

# Password server (kosongkan = tanpa password)
password

# File gamemode Lua (relatif ke folder server)
gamemode gamemode.lua

# Jawab UDP query server browser di port yang sama (1 = ya, 0 = tidak)
query 1

# Daftarkan server ke master server tiap 60 detik (1 = ya, 0 = tidak)
# Master server bisa dijalankan sendiri (romp-master) mis. di VPS.
announce 0

# Host & port master server (dipakai kalau announce = 1)
master_host 127.0.0.1
master_port 7778

# Broadcast beacon LAN tiap 5 detik (1 = ya, 0 = tidak).
# Biar client di WiFi yang sama otomatis menemukan server tanpa VPS/master.
lan_discovery 1
